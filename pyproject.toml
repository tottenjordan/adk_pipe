[project]
name = "adk-pipe"
version = "0.1.0"
description = ""
authors = [
    {name = "Jordan",email = "jordantotten@google.com"},
    {name = "JordanArgolis", email = "admin@jordantotten.altostrat.com"}
]
readme = "README.md"
license = "Apache-2.0"

requires-python = ">=3.13, <4.0"
dependencies = [
    # aiohttp: TimeoutRetryingGemini relies on genai's aiohttp async client.
    "google-genai[aiohttp]>=2.25.0,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=2.4.0,<3.0.0",
    # The `eval` extra (scipy/scikit-learn/litellm/pandas/nltk via
    # aiplatform[evaluation]) is not needed at runtime: it lives in the `eval`
    # dependency group below, so it never ships to Agent Engine or the api image.
    "google-adk[otel-gcp]>=2.10.0,<3.0.0",
    "google-cloud-bigquery>=3.45.2,<4.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "pillow>=12.3.0,<14.0.0",
    "markdown-pdf>=1.13.3,<2.0.0",
    "absl-py>=2.5.0,<3.0.0",
    "google-cloud-storage>=3.15.0,<4.0.0",
    "google-auth>=2.59.0,<3.0.0",
    "google-cloud-modelarmor>=0.7,<1",
    "google-cloud-run>=0.16.2,<1.0.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable install (`uv sync`): hatchling's dev mode writes a `.pth` that puts
# these directories on sys.path, so the first-party packages import by their bare
# names from any cwd (scripts, tests, `adk eval`) with no PYTHONPATH or sys.path
# hacks. Missing dirs are skipped by Python. https://hatch.pypa.io/latest/config/build/
dev-mode-dirs = [".", "agents", "libs", "bandit_stack"]

[tool.hatch.build.targets.wheel]
# Never built for distribution (Agent Engine gets requirements.txt, exported with
# --no-emit-project, plus extra_packages; the api image syncs --no-install-project).
# Listed so the wheel/editable build has explicit package roots.
packages = [
    "agents/trend_scout",
    "agents/creative_agent",
    "agents/interactive_creative",
    "libs/agent_common",
    "libs/creative_eval",
    "bandit_stack/bandit",
    "bandit_stack/bandit_serving",
    "bandit_stack/bandit_traffic",
]

[tool.uv]
# The project is installed editable (see [tool.hatch.build]). requirements.txt is
# exported with --no-emit-project, so it never contains `-e .`.
package = true
# No override-dependencies: only google-adk's `eval` extra caps
# google-cloud-aiplatform <2 (policy, adk fe30c015), and the `eval` group below
# lists that extra's packages itself instead of requesting google-adk[eval].
# (An override would also replace the requirement's extras, so it cannot keep
# aiplatform[evaluation] out of the runtime set.)

[dependency-groups]
# `adk eval` tooling (nightly eval CI, tests/eval/efficiency_gate.py): the
# packages of google-adk's `eval` extra, listed here rather than requested as
# google-adk[eval] because that extra caps google-cloud-aiplatform <2 (policy,
# adk fe30c015). Drift-tested against the installed google-adk metadata
# (tests/test_dependency_groups.py). Re-add google-adk[eval] once it allows 2.x.
eval = [
    "gepa>=0.1",
    "google-cloud-aiplatform[agent-engines,evaluation]>=2.4.0,<3.0.0",
    "google-cloud-texttospeech>=2.37",
    "jinja2>=3.1.4,<4",
    "nltk!=3.10.1",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3",
    "rouge-score>=0.1.2",
    "tabulate>=0.9",
    "xlrd>=2,<3",
]
# Notebook/plot scripts under experiments/ (and their tests).
experiments = [
    "kaleido>=1.4.0,<2.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "plotly>=6.9.0,<8.0.0",
]
dev = [
    {include-group = "eval"},
    {include-group = "experiments"},
    # cloud_functions/ ships its own requirements.txt; these let tests/test_crf_*
    # run in the repo env.
    "cloudevents>=1.12.0,<2.0.0",
    "functions-framework>=3.10.2,<4.0.0",
    "google-cloud-tasks>=2.26.0,<3.0.0",
    "docker>=7.1.0",
    "jax[cpu]>=0.11.2",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.1",
    "ty==0.0.89",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root (for `deployment.*`, `runserver.*`, `tests.*`) plus the package
# containers. The editable install's .pth already covers the containers in the
# main env; listing them here keeps the first-party packages importable in envs
# without the project installed (crf-deps' clean venv), where conftest's guards
# then skip on the missing google-adk rather than failing on a missing package.
pythonpath = [".", "agents", "libs", "bandit_stack"]
markers = [
    "subprocess: spawns a child process (fresh-import guards, shell entrypoint)",
    "slow: multi-second test (JAX compile, golden regeneration, image staging); skip locally with -m 'not slow'",
]
# Silence only known third-party noise, scoped by message + category (+ module),
# so any new first-party DeprecationWarning still surfaces.
filterwarnings = [
    "ignore:GOOGLE_GENAI_USE_VERTEXAI is deprecated:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212:(agentplatform|vertexai)\\._genai\\.",
]

[tool.ruff]
target-version = "py313"
line-length = 88
# First-party import roots (isort classification), matching the editable install's
# sys.path dirs.
src = [".", "agents", "libs", "bandit_stack"]
# Notebooks are exploratory. `.agents/skills/` are vendored third-party skills
# pinned by skills-lock.json hashes, so they are never reformatted.
extend-exclude = [
    ".agents/",
    "frontend/",
    "outputs/",
    "a_stash/",
    "*.ipynb",
]

[tool.ruff.lint]
# Pin the rule set explicitly (ruff's default set grows between releases).
select = ["E", "F", "I", "UP", "B"]
# Line length is owned by `ruff format`; the lines it can't wrap are long string
# literals (prompts, SQL, URLs) where hard-wrapping would hurt readability.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export submodules/symbols as the public API.
"__init__.py" = ["F401"]
# Deployment scripts prepend the project root to sys.path before importing
# first-party packages, so their module-level imports intentionally follow code.
"deployment/*.py" = ["E402"]

[tool.ty.src]
# Tests intentionally build Pydantic models / call tools with partial or mock
# kwargs to exercise validation, so ty's arg-type errors there are expected, not
# real defects. Exclude them so `ty check` reflects production-source health.
exclude = ["tests/"]
