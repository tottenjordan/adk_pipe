[project]
name = "adk-pipe"
version = "0.1.0"
description = ""
authors = [
    {name = "Jordan",email = "jordantotten@google.com"},
    {name = "JordanArgolis", email = "admin@jordantotten.altostrat.com"}
]
readme = "README.md"

requires-python = ">=3.13, <4.0"
dependencies = [
    "google-genai>=2.25.0,<3.0.0",
    # [tool.uv] override-dependencies below takes precedence; bump both together.
    "google-cloud-aiplatform[agent-engines]>=2.2.0,<3.0.0",
    "google-adk[eval,otel-gcp]>=2.10.0,<3.0.0",
    "pandas>=3.0.6,<4.0.0",
    "google-cloud-bigquery>=3.45.2,<4.0.0",
    "db-dtypes>=1.7.1,<2.0.0",
    "tabulate>=0.10.0,<0.11.0",
    "uvicorn>=0.54.0,<1.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "pillow>=12.3.0,<13.0.0",
    "markdown>=3.11,<4.0.0",
    "markdown-pdf>=1.13.3,<2.0.0",
    "absl-py>=2.5.0,<3.0.0",
    "functions-framework>=3.10.2,<4.0.0",
    "cloudevents>=1.12.0,<2.0.0",
    "google-cloud-pubsub>=2.41.0,<3.0.0",
    "plotly>=6.9.0,<8.0.0",
    "kaleido>=1.4.0,<2.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "google-cloud-storage>=3.15.0,<4.0.0",
    "pyarrow>=25.0.1,<26.0.0",
    "google-auth>=2.59.0,<3.0.0",
    "google-cloud-modelarmor>=0.7,<1",
]

[tool.uv]
package = false
# google-adk[eval] 2.10 caps google-cloud-aiplatform <2 as policy (adk fe30c015,
# "matching the other extras"), not because of a known break; 2.9.1's eval
# extra was uncapped. aiplatform 2.x still ships the `vertexai` compat module
# ADK's VertexAiSessionService imports. Remove this override once google-adk
# allows aiplatform 2.x (re-check: P1 doc, Task 0).
override-dependencies = [
    "google-cloud-aiplatform[agent-engines,evaluation]>=2.2.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so tests import the flat first-party packages
# (and `deployment.*`) without per-test sys.path hacks.
pythonpath = ["."]
markers = [
    "subprocess: spawns a child process (fresh-import guards, shell entrypoint)",
]
# Silence only known third-party noise, scoped by message + category (+ module),
# so any new first-party DeprecationWarning still surfaces.
filterwarnings = [
    "ignore:GOOGLE_GENAI_USE_VERTEXAI is deprecated:DeprecationWarning",
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince212:(agentplatform|vertexai)\\._genai\\.",
]

[tool.ruff]
target-version = "py313"
line-length = 88
# `agents/` holds symlinks back to the root agent packages (ADK web discovery),
# so linting it would double-report every file. Notebooks are exploratory.
extend-exclude = ["agents/", "frontend/", "outputs/", "a_stash/", "*.ipynb"]

[tool.ruff.lint]
# Pin the rule set explicitly (ruff's default set grows between releases).
select = ["E", "F", "I", "UP", "B"]
# Line length is owned by `ruff format`; the lines it can't wrap are long string
# literals (prompts, SQL, URLs) where hard-wrapping would hurt readability.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export submodules/symbols as the public API.
"__init__.py" = ["F401"]
# Deployment scripts prepend the project root to sys.path before importing
# first-party packages, so their module-level imports intentionally follow code.
"deployment/*.py" = ["E402"]

[tool.ty.src]
# Tests intentionally build Pydantic models / call tools with partial or mock
# kwargs to exercise validation, so ty's arg-type errors there are expected, not
# real defects. Exclude them so `ty check` reflects production-source health.
exclude = ["tests/"]

[tool.ty.rules]
# ADK's SequentialAgent/ParallelAgent are deprecated in favor of Workflow, but
# Workflow cannot yet be used as an LlmAgent sub-agent — so we cannot migrate.
# Silence the unactionable deprecation noise until ADK lifts that restriction.
deprecated = "ignore"
