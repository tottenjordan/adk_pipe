# Weekly dependency updates. Minor + patch bumps are grouped into one PR per
# ecosystem; majors come as individual PRs so they can be reviewed on their own.
# `ignore` entries hold back majors that need a deliberate migration (see
# docs/plans/2026-09-28-repo-refresh.md Phase 4) or are blocked by a co-dependency.
version: 2
updates:
  - package-ecosystem: "uv"
    # The root requirements.txt is a `uv export` of uv.lock (CI drift-checks it).
    # Dependabot otherwise scans it as a pip manifest, where every exported
    # transitive pin counts as "direct", and opens requirements.txt-only PRs
    # that fail CI (e.g. #162). Exclude it; updates land via uv.lock.
    # The Cloud Function's requirements.txt is owned by the pip entry below
    # (with its own ignores); scanned here too, it yields unresolvable bumps.
    exclude-paths:
      - "requirements.txt"
      - "cloud_functions/**"
    # The pyproject `eval` group lists google-adk's eval extra by hand (that
    # extra caps aiplatform <2); switch it back to google-adk[eval] when ADK
    # allows 2.x. tests/test_dependency_groups.py flags a new package in the extra.
    directory: "/"
    schedule:
      interval: "weekly"
    # Direct deps only: transitive bumps (otel, pydantic-core, litellm, ...) are
    # pinned/capped by google-adk / pydantic / aiplatform, so uv.lock can't take them.
    allow:
      - dependency-type: "direct"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Held at <3 in pyproject.toml (ADK 3 / genai 3 drop APIs we use).
      - dependency-name: "google-adk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/cloud_functions/creative_fanout"
    schedule:
      interval: "weekly"
    groups:
      crf-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # google-cloud-agentplatform 3.x would be a new SDK major; migrate deliberately.
      - dependency-name: "google-cloud-agentplatform"
        update-types: ["version-update:semver-major"]
      # functions-framework 3.10.2 (latest) pins cloudevents<=1.12.0.
      - dependency-name: "cloudevents"
        versions: [">1.12.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next supports eslint 9; bump with Next.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Held at the engines floor (Node 22, package.json engines); .nvmrc, the
      # image and CI run 24.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) peers typescript <6.1;
      # bump with it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/", "/frontend"]
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime versions are chosen deliberately (Python 3.13 per pyproject
      # requires-python/CI; Node 24 LTS for frontend/Dockerfile + CI). Docker
      # tags treat 3.13 -> 3.14 as a minor bump, so pin by version range.
      # frontend/Dockerfile pins node by tag + digest; this entry bumps both
      # (new 24.x tags, and digest-only refreshes of the same tag).
      - dependency-name: "python"
        versions: [">=3.14"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
