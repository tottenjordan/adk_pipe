# Weekly dependency updates. Minor + patch bumps are grouped into one PR per
# ecosystem; majors come as individual PRs so they can be reviewed on their own.
# `ignore` entries hold back majors that need a deliberate migration (see
# docs/plans/2026-09-28-repo-refresh.md Phase 4) or are blocked by a co-dependency.
version: 2
updates:
  - package-ecosystem: "uv"
    # Note: Dependabot may also bump the root requirements.txt on its own; that
    # file is a `uv export` of uv.lock, so CI's drift check fails such PRs —
    # close them (updates land via uv.lock).
    # pyproject [tool.uv] override-dependencies lifts google-adk[eval]'s
    # aiplatform <2 cap; a google-adk bump never removes it — drop it by hand
    # when ADK allows 2.x, and bump the override too on an aiplatform major.
    directory: "/"
    schedule:
      interval: "weekly"
    # Direct deps only: transitive bumps (otel, google-api-core, pydantic-core,
    # ...) are capped by google-adk / aiplatform, so they only ever arrived as
    # requirements.txt-only PRs that desync from uv.lock.
    allow:
      - dependency-type: "direct"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Held at <3 in pyproject.toml (ADK 3 / genai 3 drop APIs we use).
      - dependency-name: "google-adk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "google-genai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/cloud_functions/creative_fanout"
    schedule:
      interval: "weekly"
    groups:
      crf-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # google-cloud-agentplatform 3.x would be a new SDK major; migrate deliberately.
      - dependency-name: "google-cloud-agentplatform"
        update-types: ["version-update:semver-major"]
      # functions-framework 3.10.2 (latest) pins cloudevents<=1.12.0.
      - dependency-name: "cloudevents"
        versions: [">1.12.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # eslint-config-next supports eslint 9; bump with Next.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Tracks the Node 22 runtime (.nvmrc, Dockerfile, CI).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) peers typescript <6.1;
      # bump with it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories: ["/", "/frontend"]
    schedule:
      interval: "weekly"
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Runtime versions are chosen deliberately (Python 3.13 per pyproject
      # requires-python/CI; Node 22 LTS per .nvmrc/engines). Docker tags treat
      # 3.13 -> 3.14 as a minor bump, so pin by version range.
      - dependency-name: "python"
        versions: [">=3.14"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
