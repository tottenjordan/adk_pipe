name: Markdown Lint

# PR-only (see python-ci.yml); workflow_dispatch for a manual run.
# Rules and ignores live in .markdownlint-cli2.jsonc (MD001 + MD045 only).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/markdown-lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
