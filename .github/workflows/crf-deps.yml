name: Cloud Function deps

# The Cloud Function deploys from its own requirements.txt (not uv.lock), so
# Python CI never exercises it. Install it alone into a clean venv and run the
# CRF tests there: catches unsatisfiable pins (e.g. a Dependabot cloudevents
# 2.x bump vs functions-framework's <=1.12 pin) and missing deps. Gated to the
# files that can change that outcome; PR-only for the same reason as python-ci.yml.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloud_functions/**"
      - "tests/test_crf_*.py"
      - ".github/workflows/crf-deps.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-function-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT: test-project
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true

      - name: Install Cloud Function requirements (+ pytest)
        run: |
          uv venv .crf-venv
          VIRTUAL_ENV=.crf-venv uv pip install -r cloud_functions/creative_fanout/requirements.txt pytest

      - name: CRF tests against the function's own deps
        run: .crf-venv/bin/python -m pytest tests/test_crf_*.py -q
