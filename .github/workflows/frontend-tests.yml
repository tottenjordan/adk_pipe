name: Frontend Tests

# PR-only (see python-ci.yml); workflow_dispatch for a manual run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      # Python sources and shared fixtures the frontend tests read directly
      # (creative-brief-drift, gcs-route-person, timely): a change there can break them.
      - "agents/creative_agent/schemas.py"
      - "tests/fixtures/person_slugs.json"
      - "tests/fixtures/timely_expiry.json"
      - ".github/workflows/frontend-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major as the web image (frontend/Dockerfile, Node 24 LTS).
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # `next build` also type-checks every file in tsconfig's include
      # (tests too), so there is no separate `tsc --noEmit` step.
      - name: Build
        run: npm run build
