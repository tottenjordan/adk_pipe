# Cached Cloud Build for the bandit image (bandit_serving/Dockerfile ->
# ${_BANDIT_IMAGE}), built with BuildKit (docker buildx) and a registry layer cache
# (same pattern as the repo-root cloudbuild.yaml). One image does both jobs: its
# default entrypoint serves the CPR bandit endpoint, and the synthetic-traffic
# Cloud Run Job runs it with a command override (python -m bandit_traffic.main).
#
#   gcloud builds submit --region us-central1 \
#     --config deployment/bandit/cloudbuild.bandit.yaml \
#     --ignore-file deployment/bandit/bandit.gcloudignore \
#     "--substitutions=^;^SHORT_SHA=$(git rev-parse --short HEAD);_SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" .
#
# The ignore file uploads only bandit/, bandit_serving/ and bandit_traffic/.
# Pushes <image>:$SHORT_SHA + <image>:latest and prints the digest
# (BANDIT_IMAGE=…@sha256:…; regional builds don't stream logs, read them with
# `gcloud builds log <ID> --region us-central1`). Nothing is deployed: set the
# api's BANDIT_SERVING_IMAGE to the digest and deploy the job with
# IMAGE_TAG=$SHORT_SHA deployment/bandit/deploy_traffic_job.sh
# (docs/bandit/README.md → Build and deploy).
#
# Reproducible digests (as in cloudbuild.yaml): `rewrite-timestamp=true` +
# SOURCE_DATE_EPOCH (the commit time; default "0" since an upload has no .git) clamp
# layer file mtimes and the image `created` field, so the same commit gives the
# same digest.

substitutions:
  _BANDIT_IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/cpr/trend-trawler-bandit
  _SOURCE_DATE_EPOCH: "0"

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  # BuildKit builder (docker-container driver: needed for --cache-to
  # type=registry); buildkit from Google's Docker Hub mirror to avoid Hub pull
  # limits.
  - id: buildx-setup
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        docker buildx create --name tt --driver docker-container \
          --driver-opt image=mirror.gcr.io/moby/buildkit:buildx-stable-1 --use
        docker buildx inspect --bootstrap

  # Context is the repo root; bandit_serving/Dockerfile.dockerignore narrows it to
  # the endpoint + traffic sources.
  - id: build-bandit
    name: gcr.io/cloud-builders/docker
    waitFor: [buildx-setup]
    entrypoint: bash
    args:
      - -euc
      - |
        docker buildx build --builder tt --file bandit_serving/Dockerfile \
          --tag ${_BANDIT_IMAGE}:${SHORT_SHA} --tag ${_BANDIT_IMAGE}:latest \
          --cache-from type=registry,ref=${_BANDIT_IMAGE}:buildcache \
          --cache-to type=registry,ref=${_BANDIT_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true \
          --provenance=false \
          --output type=image,push=true,rewrite-timestamp=true \
          --build-arg SOURCE_DATE_EPOCH=${_SOURCE_DATE_EPOCH} \
          --metadata-file /workspace/bandit-meta.json .
        sed -n 's/.*"containerimage.digest": *"\(sha256:[0-9a-f]*\)".*/\1/p' \
          /workspace/bandit-meta.json > /workspace/bandit.digest
        test -s /workspace/bandit.digest
        echo "BANDIT_IMAGE=${_BANDIT_IMAGE}@$$(cat /workspace/bandit.digest)"
